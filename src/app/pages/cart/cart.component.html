<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Shopping Cart</h1>
  
  <div *ngIf="cartItems.length === 0" class="text-center py-8">
    <p class="text-gray-600">Your cart is empty</p>
    <a routerLink="/home" class="text-blue-500 hover:underline">Continue Shopping</a>
  </div>

  <div *ngIf="cartItems.length > 0">
    <div class="space-y-4">
      <div *ngFor="let item of cartItems" class="flex items-center p-4 border rounded">
        <img [src]="item.image" [alt]="item.title" class="w-20 h-20 object-contain mr-4">
        <div class="flex-grow">
          <h3 class="font-semibold">{{item.title}}</h3>
          <p class="text-gray-600">Quantity: {{item.quantity}}</p>
          <p class="text-gray-800">
            Price: ${{calculateItemTotal(item) | number:'1.2-2'}}
            <span *ngIf="item.discount" class="text-green-600 ml-2">
              ({{item.discount}}% off)
            </span>
          </p>
        </div>
        <button 
          (click)="removeItem(item.id)"
          class="text-red-500 hover:text-red-700 ml-4"
        >
          Remove
        </button>
      </div>
    </div>

    <div class="mt-8 p-4 border-t">
      <div class="text-xl font-semibold">
        Total: ${{calculateTotal() | number:'1.2-2'}}
      </div>
      
      <div class="mt-4">
        <a 
          routerLink="/checkout"
          class="inline-block bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600"
        >
          Proceed to Checkout
        </a>
      </div>
    </div>
  </div>
</div>
