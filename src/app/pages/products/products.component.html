<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-2xl my-6 p-8 md:p-16">
      <div class="max-w-3xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">Discover Amazing Products</h1>
        <p class="text-lg md:text-xl mb-8 opacity-90">Shop the latest trends and must-have items</p>
        
        <div class="max-w-2xl mx-auto flex flex-col sm:flex-row gap-4">
          <input 
            type="text" 
            [(ngModel)]="searchQuery" 
            (input)="searchProducts()"
            placeholder="Search products..."
            class="flex-1 px-6 py-3 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-white/50"
          >
          <button 
            (click)="searchProducts()"
            class="px-8 py-3 bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors duration-200"
          >
            Search
          </button>
        </div>
      </div>
    </section>
  
    <!-- Filters Section -->
    <section class="flex flex-col md:flex-row justify-between items-center gap-6 my-8">
      <div class="flex flex-wrap gap-3">
        <button 
          [ngClass]="{'bg-indigo-600 text-white': selectedCategory === null,
                     'bg-white text-gray-700 hover:bg-gray-50': selectedCategory !== null}"
          (click)="handleCategoryFilter(null)"
          class="px-4 py-2 rounded-lg border border-gray-200 transition-colors duration-200"
        >
          All
        </button>
        <button 
          *ngFor="let category of categories"
          (click)="handleCategoryFilter(category)"
          [class.bg-purple-600]="selectedCategory === category"
          [class.text-white]="selectedCategory === category"
          class="px-4 py-2 rounded-full border border-purple-600 hover:bg-purple-600 hover:text-white transition-colors"
        >
          {{category}}
        </button>
      </div>
  
      <select 
        [(ngModel)]="sortOption" 
        (change)="sortProducts()"
        class="px-4 py-2 rounded-lg border border-gray-200 min-w-[200px] focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
        <option value="featured">Featured</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="rating">Best Rating</option>
      </select>
    </section>
  
    <!-- Loading Spinner -->
    <div *ngIf="loading" class="fixed inset-0 flex items-center justify-center bg-black/20">
      <div class="w-12 h-12 border-4 border-gray-200 border-t-indigo-600 rounded-full animate-spin"></div>
    </div>
  
    <!-- Products Grid -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 my-8">
      <div 
        *ngFor="let product of filteredProducts.length > 0 ? filteredProducts : products"
        [routerLink]="['/product', product.id]"
        class="bg-white rounded-xl shadow-lg overflow-hidden transition-transform duration-300 hover:-translate-y-2 cursor-pointer"
        data-testid="product-card"
      >
        <!-- Product Image -->
        <div class="relative group">
          <img 
            [src]="product.image" 
            [alt]="product.title"
            class="w-full h-48 object-contain mb-4"
          >
          <button 
            (click)="handleWishlistToggle(product)"
            data-testid="wishlist-button"
            class="absolute top-4 right-4 p-2 rounded-full bg-white shadow-md hover:bg-gray-100 transition-colors"
          >
            <svg [class.text-red-500]="wishlistService.isInWishlist(product.id.toString())" 
                 class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
        </div>
  
        <!-- Product Info -->
        <div class="p-6">
          <h3 class="text-lg font-semibold text-gray-800 mb-2">{{product.title}}</h3>
          <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{product.description}}</p>
  
          <!-- Price -->
          <div class="flex items-center gap-2 mb-4">
            <span class="text-xl font-semibold text-indigo-600">
              ${{calculateDiscountedPrice(product.price, product.discount) | number:'1.2-2'}}
            </span>
            <span 
              *ngIf="product.discount"
              class="text-sm text-gray-400 line-through"
            >
            -{{product.discount}}% OFF
            </span>
          </div>
  
          <!-- Rating -->
          <div class="flex items-center gap-2 mb-4">
            <span class="text-yellow-400">{{getStarRating(product.rating)}}</span>
            <span class="text-sm text-gray-600">{{product.rating}}</span>
          </div>
  
          <!-- Action Buttons -->
          <div class="flex gap-3">
            <button
              (click)="handleAddToCart(product)"
              data-testid="add-to-cart-button"
              class="flex-1 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors duration-200"
            >
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </section>
    <button (click)="handleCategoryFilter(null)" class="mt-4 text-purple-600 hover:text-purple-700">
      View all products
    </button>
  </div>
